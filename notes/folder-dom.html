<!--
  ============================================================
  Key structural observations (extracted from raw capture):
  ============================================================

  Tag:        <zen-folder> in XUL namespace (http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul)
  Element ID: timestamp-based, e.g. "1778651155346-32" — stable across sessions, safe to use as selector key

  Attributes on <zen-folder>:
    id                  unique stable folder ID
    label               display name
    zen-workspace-id    workspace UUID (so folders are workspace-scoped)
    hasmultipletabs     present when folder has >1 tab
    hasactivetab        present when one of the folder's tabs is currently active
    collapsed           present when folder is closed (toggled by Zen on click)
    style               injects --tab-group-color* CSS vars from workspace color
    NO per-folder color attribute  — color comes from workspace, not the folder itself.
                                     If we want per-folder coloring we add our own attr
                                     (e.g. zenfold-color="hue") and override the vars.

  Children structure:
    <hbox class="tab-group-label-container zen-drop-target">       — clickable header
      <html:div class="tab-group-folder-icon"> <svg state="open|close"> ...</svg> </html:div>
      <label class="tab-group-label" aria-expanded="true|false">{label}</label>
      <image class="tab-reset-button reset-icon">                  — "unload active" button
    <html:div class="tab-group-container">                          — body, holds tabs + nested folders
      <html:div class="zen-tab-group-start">                        — top spacer
      <tab is="tabbrowser-tab" ...>                                 — flat list, no extra wrapper
      <zen-folder ...>                                              — nested folders sit inline among tabs
    <vbox class="tab-group-overflow-count-container">               — "+N more tabs" badge (when overflowing)
      <label class="tab-group-overflow-count">+N</label>

  Tabs inside folders:
    - All carry pinned="true" (folders apparently group pinned tabs in Zen)
    - When folder has collapsed="", child <tab>s get aria-hidden="true"
    - selected/visuallyselected attributes mark the active tab

  SVG folder icon:
    - state attribute toggles open ("open") vs closed ("close") look
    - active="true|false" likely tracks whether folder owns active tab
    - Uses CSS vars: --zen-folder-behind-bgcolor, --zen-folder-front-bgcolor, --zen-folder-stroke
    - <g class="icon"><image href=""> — empty href; this is the slot for a custom folder favicon

  Workspace color binding:
    style="--tab-group-color: var(--tab-group-color-zen-workspace-color); ..."
    Three vars are bound to workspace colors. To override per-folder we just set these three on the element.
-->
